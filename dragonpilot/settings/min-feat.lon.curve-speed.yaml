settings:
  - key: dp_lon_curve_speed
    type: toggle_item
    title: "Curve Speed (shadow, log only)"
    description: "Works out how much to slow for a bend the model sees ahead (sunnypilot's vision Smart Cruise Control) and logs it. Shadow only: it never changes speed or braking."
    category: "Longitudinal"
    condition: "openpilotLongitudinalControl"
    flags: PERSISTENT
    param_type: BOOL
    default: "0"
