settings:
  - key: dp_ui_map_display
    type: toggle_item
    title: "Map Info Display (Beta)"
    description: "Run mapd (offline OpenStreetMap) and show speed limit, next speed limit and map curve speed on the HUD.<br>Display only: openpilot does NOT change speed based on map data.<br>Maps must be downloaded first. Restart required."
    category: "UI"
    condition: "not MICI"
    flags: PERSISTENT
    param_type: BOOL
    default: "0"
